[package]
name = "quote-benchmark"
version = "0.0.0"
authors = ["David Tolnay <dtolnay@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
proc-macro = true
path = "lib.rs"

[[bin]]
name = "quote-benchmark"
path = "main.rs"

[dependencies]
proc-macro2 = { package = "proc-macro2-send", git = "https://github.com/Riateche/proc-macro2.git", branch = "send", default-features = false }
quote-send = { path = ".." }
termcolor = "1.1"
